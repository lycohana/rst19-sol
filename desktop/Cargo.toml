[package]
name = "rst19-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"

[profile.release]
lto = "thin"
strip = true
