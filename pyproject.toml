[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rst19-sol"
version = "0.1.0"
description = "开运一号天基图像星点检测与星表匹配基线"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rst19 = "rst19.cli:main"
rst19-gui = "rst19.gui:main"
rst19-ui = "rst19.gui:main"
rst19-sequence = "rst19.sequence_cli:main"
rst19-innovation = "rst19.innovation_cli:main"
rst19-injection = "rst19.injection_cli:main"
rst19-sweep = "rst19.sweep_cli:main"
rst19-trails = "rst19.trail_cli:main"
rst19-sources = "rst19.source_cli:main"
rst19-feature-sequence = "rst19.feature_sequence_cli:main"
rst19-pair-audit = "rst19.pair_audit_cli:main"
rst19-multipsf-audit = "rst19.multipsf_cli:main"
rst19-free-multipsf-audit = "rst19.free_multipsf_cli:main"
rst19-temporal-codes = "rst19.temporal_code_cli:main"
rst19-feature-cross = "rst19.feature_cross_cli:main"
rst19-wcs-validation = "rst19.wcs_validation_cli:main"
rst19-aux-audit = "rst19.attitude_cli:main"
rst19-forced-stability = "rst19.forced_stability:main"
rst19-empirical-pair-audit = "rst19.empirical_pair_cli:main"
rst19-pair-covariance-audit = "rst19.pair_flux_covariance_cli:main"
rst19-empirical-pair-fit = "rst19.empirical_pair_fit_cli:main"
rst19-empirical-pair-free = "rst19.empirical_pair_free_cli:main"
rst19-pair-pixel-topology = "rst19.pair_pixel_topology_cli:main"
rst19-feature-psf-leaveout = "rst19.feature_psf_leaveout_cli:main"
rst19-feature-evidence = "rst19.feature_evidence_cli:main"
rst19-feature-evidence-axes = "rst19.feature_evidence_axes_cli:main"
rst19-source-peak-consistency = "rst19.source_peak_consistency_cli:main"
rst19-source-proposal-peak-audit = "rst19.source_proposal_peak_audit_cli:main"
rst19-source-proposal-temporal-audit = "rst19.source_proposal_temporal_audit_cli:main"
rst19-feature-audit-replicates = "rst19.feature_audit_replicates_cli:main"
rst19-signed-null-audit = "rst19.signed_null_cli:main"
rst19-signed-null-sequence = "rst19.signed_null_sequence_cli:main"
rst19-signed-null-overlap = "rst19.signed_null_forward_overlap_cli:main"
rst19-source-separation-audit = "rst19.source_separation_audit_cli:main"
rst19-source-group-audit = "rst19.source_group_audit_cli:main"
rst19-source-group-sensitivity = "rst19.source_group_sensitivity_cli:main"
rst19-direct-neighbor-audit = "rst19.direct_neighbor_audit_cli:main"
rst19-pair-response-attribution = "rst19.pair_response_attribution_cli:main"
rst19-pair-repair-counterfactual = "rst19.pair_repair_counterfactual_cli:main"
rst19-pair-mechanism-context = "rst19.pair_mechanism_context_cli:main"
rst19-pair-mechanism-sensitivity = "rst19.pair_mechanism_sensitivity_cli:main"
rst19-pair-support-audit = "rst19.pair_support_audit_cli:main"
rst19-spatial-injection = "rst19.spatial_injection_cli:main"
rst19-aperture-sensitivity = "rst19.aperture_sensitivity_cli:main"
rst19-feature-parameter-sensitivity = "rst19.feature_parameter_sensitivity_cli:main"
rst19-feature-sequence-compare = "rst19.feature_sequence_compare_cli:main"
rst19-feature-class-context = "rst19.feature_class_context_cli:main"
rst19-feature-hard-negative = "rst19.feature_hard_negative_cli:main"
rst19-feature-spatial-context = "rst19.feature_spatial_context_cli:main"
rst19-feature-transition-flow = "rst19.feature_transition_flow_cli:main"
rst19-feature-effect-size = "rst19.feature_effect_size_cli:main"
rst19-feature-correlation = "rst19.feature_correlation_cli:main"
rst19-aperture-peak-ratio = "rst19.aperture_peak_ratio_cli:main"
rst19-feature-flag-profile = "rst19.feature_flag_profile_cli:main"
rst19-feature-flag-interaction = "rst19.feature_flag_interaction_cli:main"
rst19-feature-gate-margin = "rst19.feature_gate_margin_cli:main"
rst19-feature-gate-route = "rst19.feature_gate_route_cli:main"
rst19-feature-gate-temporal-route = "rst19.feature_gate_temporal_route_cli:main"
rst19-format-audit = "rst19.format_audit_cli:main"
rst19-contaminated-pair-injection = "rst19.contaminated_pair_injection_cli:main"
rst19-contaminated-pair-class = "rst19.contaminated_pair_class_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
line-length = 120
