[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rst19-sol"
version = "0.1.0"
description = "开运一号天基图像星点检测与星表匹配基线"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rst19-gui = "rst19.desktop_launcher:main"
rst19-ui = "rst19.desktop_launcher:main"
rst19-tk = "rst19.gui:main"
rst19-gaia-frame = "rst19.gaia_frame_cli:main"
rst19-photometric-auto = "rst19.photometric_workflow_cli:main"
rst19-plate-solver = "rst19.plate_solver_cli:main"
rst19-sequence = "rst19.sequence_cli:main"
rst19-innovation = "rst19.innovation_cli:main"
rst19-injection = "rst19.injection_cli:main"
rst19-pair-audit = "rst19.pair_audit_cli:main"
rst19-source-peak-consistency = "rst19.source_peak_consistency_cli:main"
rst19-source-proposal-peak-audit = "rst19.source_proposal_peak_audit_cli:main"
rst19-source-proposal-temporal-audit = "rst19.source_proposal_temporal_audit_cli:main"
rst19-source-separation-audit = "rst19.source_separation_audit_cli:main"
rst19-source-group-audit = "rst19.source_group_audit_cli:main"
rst19-source-group-sensitivity = "rst19.source_group_sensitivity_cli:main"
rst19-direct-neighbor-audit = "rst19.direct_neighbor_audit_cli:main"
rst19-pair-mechanism-context = "rst19.pair_mechanism_context_cli:main"
rst19-pair-mechanism-sensitivity = "rst19.pair_mechanism_sensitivity_cli:main"
rst19-spatial-injection = "rst19.spatial_injection_cli:main"
rst19-feature-class-context = "rst19.feature_class_context_cli:main"
rst19-feature-hard-negative = "rst19.feature_hard_negative_cli:main"
rst19-feature-transition-flow = "rst19.feature_transition_flow_cli:main"
rst19-feature-effect-size = "rst19.feature_effect_size_cli:main"
rst19-feature-correlation = "rst19.feature_correlation_cli:main"
rst19-feature-flag-profile = "rst19.feature_flag_profile_cli:main"
rst19-feature-flag-interaction = "rst19.feature_flag_interaction_cli:main"
rst19-feature-gate-margin = "rst19.feature_gate_margin_cli:main"
rst19-feature-gate-route = "rst19.feature_gate_route_cli:main"
rst19-feature-cross-axis-audit = "rst19.feature_cross_axis_audit_cli:main"
rst19-ablation = "rst19.ablation_cli:main"
rst19-motion-ablation = "rst19.motion_ablation_cli:main"
rst19-motion-proposal-ablation = "rst19.motion_proposal_ablation_cli:main"
rst19-crowded-ablation = "rst19.crowded_ablation_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
line-length = 120
