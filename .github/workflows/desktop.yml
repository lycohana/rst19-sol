name: Rust desktop packages
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', 'src/rst19/**', 'pyproject.toml', '.github/workflows/desktop.yml']
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo test --locked --manifest-path desktop/Cargo.toml
      - run: python desktop/build.py
      - name: Exercise bundled worker
        shell: python
        run: |
          import pathlib, subprocess, sys
          package = sorted(p for p in pathlib.Path('dist').glob('RST19-*') if p.is_dir())[-1]
          subprocess.run([sys.executable, 'desktop/verify_package.py', str(package), '--out', 'tmp/package-verification'], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: RST19-${{ runner.os }}
          path: dist/*.zip
