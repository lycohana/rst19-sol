name: Rust desktop packages
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', 'backend/**', '.github/workflows/desktop.yml']
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo test -j4 --locked --manifest-path backend/Cargo.toml
      - run: cargo build -j4 --locked --manifest-path desktop/Cargo.toml --bin rst19-native-worker
      - run: cargo test -j4 --locked --manifest-path desktop/Cargo.toml
      - name: Build and verify native package
        run: cargo run --locked --manifest-path backend/Cargo.toml --bin rst19-package -- build
      - uses: actions/upload-artifact@v4
        with:
          name: RST19-${{ runner.os }}
          path: dist/*.zip
