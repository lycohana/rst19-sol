        - heading "“二维支持”是什么意思？" [level=3] [ref=e214]
        - paragraph [ref=e215]:
          - text: 一个正常光斑的光通常会落在相邻像素上。如果几乎只有一个格子特别亮，周围没有足够支持，就值得怀疑它是否符合当前点源模型。论文检查峰附近 3×3 的小区域。
          - strong [ref=e216]: 单像素很亮也不能绕过这项检查。
        - heading "为什么要分成八类，而不是统一叫“假星”？" [level=3] [ref=e217]
        - paragraph [ref=e218]: 落选原因不同，下一步也不同：暗响应要检查噪声；边缘源要检查孔径；拥挤源要联合拟合；长线要走运动分支；异常码要查设备语义。程序只给首要原因分组，同时保留其他标记。
