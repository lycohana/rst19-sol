        - generic [ref=e196]: 第 05 项 / 13 · 为什么会有落选源
        - heading "一个响应很亮，为什么还不让它进质量名单？" [level=2] [ref=e197]
        - paragraph [ref=e198]: 因为“看得见”与“可以可靠地测量成一个独立点源”是两件事。
        - generic [ref=e199]:
          - generic [ref=e200]: 生活类比
          - paragraph [ref=e201]: 有人说话很大声，你确实听见了。但录音可能是爆音、几个人同时说话，或者麦克风故障。音量大，不能自动替代清晰度、设备正常和说话者独立性。
        - paragraph [ref=e202]: 论文的质量层检查四个方向：信号够不够明显；像素读数与测量区域是否有效；有没有正常的二维光斑支持；附近的光能否分成独立源。
