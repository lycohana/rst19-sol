        - generic [ref=e78]: 第 02 项 / 13 · 图像是什么
        - heading "星空图片，其实是一张数字表" [level=2] [ref=e79]
        - paragraph [ref=e80]: 每个小格是一个像素。格子里的数字表示相机记录到的信号，而不是“这里有一颗星”。
        - paragraph [ref=e81]:
          - text: 这批图片每张是
          - strong [ref=e82]: 4096 × 4096
          - text: 个像素，也就是约 1678 万个小格。一颗星的光往往分散在几个或更多相邻像素里。所以，像素数和星星数量完全是两件事。
        - generic [ref=e83]:
          - generic [ref=e84]: 生活类比
          - paragraph [ref=e85]: 一张体育场座位图有一万个格子，但一个人可能站在过道，几个座位也可能被同一张毯子覆盖。看到“一个格子亮了”，不能直接认定“这里恰好是一个人”。
        - generic [ref=e86]:
          - generic [ref=e87]:
            - heading "FITS：科学照片的文件袋" [level=3] [ref=e88]
            - paragraph [ref=e89]: 它保存数字图像，也保存拍摄时间、尺寸、曝光等说明。你可把它理解成“照片＋拍摄记录”。
          - generic [ref=e90]:
            - heading "ADU：相机的数字读数" [level=3] [ref=e91]
            - paragraph [ref=e92]: 像温度计上的原始刻度。它不是标准星等，也不能在未校准时直接当作收到的光子数量。
        - paragraph [ref=e93]:
          - text: 论文的数据是 15 张连续观测，曝光都是
          - strong [ref=e94]: 1.5 秒
          - text: 。第一张到最后一张的曝光中心相隔
          - strong [ref=e95]: 21.014 秒
          - text: 。相邻拍摄时间并不完全相等，因此计算速度时必须用实际时间。
        - generic [ref=e96]: 文件里还夹带了一小段辅助记录，位置在首行前 208 字节。程序必须把它当作记录而不是星光；否则有可能“从说明文字中识别出星星”。
        - heading "“文件核对”在证明什么？" [level=3] [ref=e97]
        - paragraph [ref=e98]:
          - text: 论文用 SHA-256 给原文件算“数字指纹”，核对缓存是否引用同一份图片。它可以防止用错数据，
          - strong [ref=e99]: 不能证明算法找对了星星
          - text: 。就像确认两份试卷完全相同，不等于确认试卷答案正确。
        - generic [ref=e100]:
          - strong [ref=e101]: 这一项只记住：
