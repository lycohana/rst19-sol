          - text: 论文不只用一个尺度的模具，还使用
          - strong [ref=e185]: DoG（高斯差分）
          - text: ：把不同模糊程度的图片相减，让某些尺寸的结构更容易显出来。不同提案器给出的候选先合并，之后统一回原图检查。
