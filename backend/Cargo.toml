[package]
name = "rst19-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "rst19_core"
path = "src/lib.rs"

[[bin]]
name = "rst19-engine"
path = "src/main.rs"

[[bin]]
name = "rst19"
path = "src/bin/rst19.rs"

[[bin]]
name = "rst19-aux-audit"
path = "src/bin/rst19-aux-audit.rs"

[[bin]]
name = "rst19-source-geometry-audit"
path = "src/bin/rst19-source-geometry-audit.rs"

[[bin]]
name = "rst19-gaia-merge"
path = "src/bin/rst19-gaia-merge.rs"

[[bin]]
name = "rst19-format-audit"
path = "src/bin/rst19-format-audit.rs"

[[bin]]
name = "rst19-relative-photometry"
path = "src/bin/rst19-relative-photometry.rs"

[[bin]]
name = "rst19-wcs-validation"
path = "src/bin/rst19-wcs-validation.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
regex = "1"
csv = "1"
unicode-casefold = "0.2"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
sha2 = "0.10"
png = "0.18"

[profile.release]
lto = "thin"
strip = true
