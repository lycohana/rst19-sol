[package]
name = "rst19-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "rst19_core"
path = "src/lib.rs"

[[bin]]
name = "rst19-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
strip = true
